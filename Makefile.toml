# Makefile.toml - Build tasks for CrissCrossFS
# Usage: cargo make <task>

[config]
default_to_workspace = false

# ============================================================================
# CrissCrossFS Tasks (User-mode XFS filesystem) - DEFAULT
# ============================================================================

[tasks.default]
description = "Build CrissCrossFS (debug)"
script_runner = "powershell"
script_extension = "ps1"
script = '''
Write-Host "Building CrissCrossFS (debug)..." -ForegroundColor Cyan
cargo build -p fs-winfsp-glue
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
Write-Host "Build complete! Binary: target\debug\crisscrossfs.exe" -ForegroundColor Green
'''

[tasks.release]
description = "Build CrissCrossFS (release)"
script_runner = "powershell"
script_extension = "ps1"
script = '''
Write-Host "Building CrissCrossFS (release)..." -ForegroundColor Cyan
cargo build -p fs-winfsp-glue --release
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
Write-Host "Build complete! Binary: target\release\crisscrossfs.exe" -ForegroundColor Green
'''

[tasks.run]
description = "Run CrissCrossFS (debug)"
dependencies = ["default"]
script_runner = "powershell"
script_extension = "ps1"
script = '''
Write-Host "Running crisscrossfs..." -ForegroundColor Cyan
."target\debug\crisscrossfs.exe"
'''

[tasks.run-release]
description = "Run CrissCrossFS (release)"
dependencies = ["release"]
script_runner = "powershell"
script_extension = "ps1"
script = '''
Write-Host "Running crisscrossfs (release)..." -ForegroundColor Cyan
."target\release\crisscrossfs.exe"
'''

[tasks.test]
description = "Run all workspace tests"
script_runner = "powershell"
script_extension = "ps1"
script = '''
cargo test --workspace --all-targets
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''

[tasks.clippy]
description = "Run strict Clippy checks"
script_runner = "powershell"
script_extension = "ps1"
script = '''
cargo clippy --workspace --all-targets -- -D warnings
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''

[tasks.fmt]
description = "Check Rust formatting"
script_runner = "powershell"
script_extension = "ps1"
script = '''
cargo fmt --all -- --check
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''

# ============================================================================
# Help
# ============================================================================

[tasks.help]
description = "Show available tasks"
script_runner = "powershell"
script_extension = "ps1"
script = '''
Write-Host ""
Write-Host "CrissCrossFS Build Tasks" -ForegroundColor Cyan
Write-Host "=============================" -ForegroundColor Cyan
Write-Host ""
Write-Host "Main Commands:" -ForegroundColor Yellow
Write-Host "  cargo make              - Build CrissCrossFS (debug)"
Write-Host "  cargo make release      - Build CrissCrossFS (release)"
Write-Host "  cargo make run          - Run crisscrossfs (debug)"
Write-Host "  cargo make run-release  - Run crisscrossfs (release)"
Write-Host "  cargo make test         - Run all tests"
Write-Host "  cargo make clippy       - Run strict Clippy"
Write-Host "  cargo make fmt          - Check formatting"
Write-Host ""
Write-Host "Help:" -ForegroundColor Yellow
Write-Host "  cargo make help         - Show this help message"
Write-Host ""
'''