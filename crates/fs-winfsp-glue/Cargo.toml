[package]
name = "fs-winfsp-glue"
version = "0.1.0"
edition = "2021"
description = "Generic WinFsp glue layer for VFS filesystems"
license = "GPL-3.0"
authors = ["XFS Development Team"]

[build-dependencies]
winfsp = "0.12"

[dependencies]
# VFS abstraction layer
fs-abstraction = { path = "../fs-abstraction", default-features = false, features = ["std"] }

# Filesystem implementations
xfs-rs = { path = "../xfs-rs", default-features = false, features = ["std"] }
xfs-vfs = { path = "../xfs-vfs" }

# WinFsp bindings
# "system" lets `winfsp_init` fall back to the InstallDir registry value, so the
# DLL is found even when WinFsp\bin is not on PATH (typically GUI launches).
winfsp = { version = "0.12", features = ["debug", "system"] }
winfsp-sys = "0.12"          # Keep FFI types on the same WinFsp 2.1 version as the safe bindings

# Windows APIs
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Services",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Error handling & logging
thiserror = "2.0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }
ctrlc = "3.2"

# Serialization for config
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[[bin]]
name = "xfs-mount"
path = "src/main.rs"

[[bin]]
name = "xfs-mount-gui"
path = "src/gui_main.rs"
