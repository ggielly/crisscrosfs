[workspace]
resolver = "2"
members = [
    "crates/fs-abstraction",
    "crates/xfs-rs",
    "crates/xfs-vfs",
    "crates/fs-winfsp-glue",
]
# cargo-fuzz has its own workspace and is run with `cargo fuzz`.
exclude = ["fuzz"]

# Build: cargo build -p fs-winfsp-glue

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPLv3"
[workspace.dependencies]
# Benchmark dependencies
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Unwind so a panic reaching a WinFsp callback cannot take down the whole
# service process (callbacks are caught at the FFI boundary).
panic = "unwind"
strip = true

[profile.dev]
opt-level = 0
debug = true
panic = "unwind"
incremental = true
strip = false

