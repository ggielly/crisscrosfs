name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM
        run: choco install llvm --yes
      - name: Configure libclang
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rustfmt,clippy
      - name: Build and test
        run: cargo test --workspace --all-targets
      - name: Check fuzz workspace
        run: cargo check --manifest-path fuzz/Cargo.toml
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all -- --check

  parser-vfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rustfmt,clippy
      - name: Test parser and VFS
        run: cargo test -p fs-abstraction -p xfs-rs -p xfs-vfs --all-targets
      - name: Clippy
        run: cargo clippy -p fs-abstraction -p xfs-rs -p xfs-vfs --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all -- --check
